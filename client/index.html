<body>
    <div id="game-container"></div>
    
    <div id="menu-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; text-align: center; font-family: sans-serif;">
        <h1>Scotland Yard</h1>
        <button id="btn-create" style="padding: 10px 20px; cursor: pointer;">Create Game</button>
        <hr style="margin: 20px 0;"/>
        <input type="text" id="input-code" placeholder="ENTER CODE" style="text-transform: uppercase; padding: 8px;">
        <button id="btn-join" style="padding: 8px 16px; cursor: pointer;">Join Game</button>
    </div>

    <div id="game-ui" style="display: none; position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 8px; font-family: sans-serif; min-width: 150px; pointer-events: none;">
        <h2 style="margin: 0 0 10px 0; font-size: 18px; border-bottom: 1px solid #555; padding-bottom: 5px;">
            Lobby: <span id="lobby-code-display" style="color: #f6e05e;">???</span>
        </h2>
        <div id="player-list">
            </div>
        <div style="margin-top: 15px; font-size: 12px; color: #aaa; border-top: 1px solid #555; padding-top: 5px;">
            Round: <span id="round-display">0</span>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
