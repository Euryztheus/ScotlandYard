<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scotland Yard</title>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #333; }
      ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
      
      .btn-2x {
          background: #333; color: #fff; border: 1px solid #555; padding: 5px 10px; cursor: pointer; width: 100%; margin-top: 5px;
      }
      .btn-2x.active {
          background: #d69e2e; color: #000; font-weight: bold; border-color: #d69e2e;
      }
      /* New style for the utility button */
      .btn-util {
          background: transparent; color: #aaa; border: 1px solid #555; padding: 4px 8px; cursor: pointer; font-size: 11px; margin-top: 5px; width: 100%;
      }
      .btn-util:hover { background: #333; color: #fff; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    
    <div id="menu-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; text-align: center; z-index: 1000;">
        <h1>Scotland Yard</h1>
        <button id="btn-create" style="padding: 10px 20px; cursor: pointer;">Create Game</button>
        <hr style="margin: 20px 0;"/>
        <input type="text" id="input-code" placeholder="ENTER CODE" style="text-transform: uppercase; padding: 8px;">
        <button id="btn-join" style="padding: 8px 16px; cursor: pointer;">Join Game</button>
    </div>

    <div id="lobby-screen" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #333; color: white; padding: 20px; border-radius: 8px; width: 450px; max-height: 90vh; overflow-y: auto; z-index: 1000;">
        <h1 style="margin-top: 0; text-align: center;">Lobby <span id="lobby-code-title" style="color: #f6e05e;"></span></h1>
        <div style="margin-bottom: 10px; display: flex; justify-content: flex-end;">
            <button id="btn-claim-mrx" style="padding: 5px 10px; background: #000; color: #fff; border: 1px solid #555; cursor: pointer; font-size: 12px;">🕵️ Claim Mr. X</button>
        </div>
        <div id="lobby-player-list" style="background: #444; padding: 10px; margin-bottom: 15px; border-radius: 4px;"></div>
        <div id="lobby-settings" style="margin-bottom: 15px; border-top: 1px solid #555; padding-top: 10px;">
            <h3 style="margin: 0 0 10px 0; font-size: 16px;">Game Settings (Host Only)</h3>
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox" id="setting-infinite"> Infinite Tickets
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
                <div style="background: #2a4365; padding: 10px; border-radius: 4px;">
                    <strong style="color: #63b3ed;">Detectives</strong>
                    <div style="margin-top: 5px;">
                        Taxi: <input type="number" id="set-det-taxi" style="width: 40px;" min="0"><br>
                        Bus: <input type="number" id="set-det-bus" style="width: 40px; margin-top: 2px;" min="0"><br>
                        Und: <input type="number" id="set-det-und" style="width: 40px; margin-top: 2px;" min="0">
                    </div>
                </div>
                <div style="background: #2d3748; padding: 10px; border-radius: 4px;">
                    <strong style="color: #a0aec0;">Mr. X</strong>
                    <div style="margin-top: 5px;">
                        Taxi: <input type="number" id="set-mrx-taxi" style="width: 40px;" min="0"><br>
                        Bus: <input type="number" id="set-mrx-bus" style="width: 40px; margin-top: 2px;" min="0"><br>
                        Und: <input type="number" id="set-mrx-und" style="width: 40px; margin-top: 2px;" min="0"><br>
                        Black: <input type="number" id="set-mrx-black" style="width: 40px; margin-top: 2px;" min="0"><br>
                        <hr style="border-color: #555; margin: 5px 0;">
                        2x Tickets: <input type="number" id="set-mrx-2x" style="width: 40px;" min="0" max="5">
                    </div>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btn-ready" style="flex: 1; padding: 12px; cursor: pointer; background: #555; color: white; border: none; font-weight: bold;">Not Ready</button>
            <button id="btn-start" style="flex: 1; padding: 12px; cursor: pointer; background: #28a745; color: white; border: none; display: none; font-weight: bold;">START GAME</button>
        </div>
    </div>

    <div id="game-ui" style="display: none; position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 8px; font-family: sans-serif; min-width: 180px; z-index: 500;">
        <h2 style="margin: 0 0 10px 0; font-size: 18px; border-bottom: 1px solid #555; padding-bottom: 5px;">
            Lobby: <span id="lobby-code-display" style="color: #f6e05e;">???</span>
        </h2>
        
        <div id="player-list"></div>

        <div id="mrx-actions" style="display: none; margin-top: 10px; border-top: 1px solid #555; padding-top: 5px;">
            <button id="btn-use-2x" class="btn-2x">USE 2x TICKET</button>
        </div>

        <div id="mrx-tracker" style="margin-top: 15px; border-top: 1px solid #555; padding-top: 10px; cursor: pointer;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; color: #a0aec0;">Mr. X Log</span>
                <span id="tracker-summary" style="font-size: 12px; color: #f6e05e;">Round 0</span>
                <span id="tracker-icon">▼</span>
            </div>
            
            <div id="tracker-mini" style="font-size: 11px; color: #888; margin-top: 4px;">
                Next Reveal: Round <span id="next-reveal-round">3</span>
            </div>

            <div id="tracker-history" style="display: none; max-height: 200px; overflow-y: auto; margin-top: 10px;">
                </div>
        </div>

        <div style="margin-top: 15px; font-size: 12px; color: #aaa; border-top: 1px solid #555; padding-top: 5px;">
            Round: <span id="round-display">0</span>
            <button id="btn-toggle-players" class="btn-util">👁️ Hide Players</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
